[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eds-regime"
version = "0.1.0"
description = "Audit-grade regime engine with deterministic outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.23",
  "python-multipart>=0.0.6",
]

[project.scripts]
eds-regime = "core.regime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"core.regime" = ["resources/*.yaml", "resources/*.json"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true
